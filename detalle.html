<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REELIX - Detalle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/fx.js"></script>
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar">

        <div class="logo">
            REELIX
        </div>

        <div class="nav-links">
            <a href="catalogo.html">Mi catálogo</a>
            <a href="ver-mas-tarde.html">Ver más tarde</a>
            <a href="agregar.html" class="add-btn">+ Agregar</a>
            <a href="#" class="nav-user">Usuario</a>
            <a href="index.html">Salir</a>
        </div>

    </nav>


    <!-- Detalle del contenido -->
    <main class="detail-container">

        <a href="catalogo.html" class="back-link">
            ← Volver al catálogo
        </a>


        <section class="detail-content">

            <!-- Poster -->
            <div class="detail-poster">

                <img
                    id="detalle-imagen"
                    src=""
                    alt="Poster"
                >

            </div>


            <!-- Información -->
            <div class="detail-info">

                <span id="detalle-tipo" class="detail-type">
                    Película
                </span>

                <h1 id="detalle-titulo">
                    Título
                </h1>


                <div class="detail-meta">

                    <span id="detalle-anio">
                        Año
                    </span>

                    <span>•</span>

                    <span id="detalle-genero">
                        Género
                    </span>

                    <span>•</span>

                    <span id="detalle-duracion">
                        Duración
                    </span>

                </div>


                <div class="detail-rating">

                    ⭐

                    <span id="detalle-calificacion">
                        0
                    </span>

                    / 10

                </div>


                <h2>Sinopsis</h2>

                <p id="detalle-sinopsis">
                    Sinopsis del contenido.
                </p>


                <!-- Acciones -->
                <div class="detail-actions">

                    <a
                        href="editar.html"
                        class="primary-btn"
                    >
                        Editar
                    </a>

                    <button
                        id="btn-eliminar"
                        class="delete-btn"
                        type="button"
                    >
                        Eliminar
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script type="module" src="js/detalle.js"></script>

</body>
</html>
