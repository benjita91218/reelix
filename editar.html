<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar contenido - REELIX</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/fx.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="logo">REELIX</div>

        <div class="nav-links">
            <a href="catalogo.html">Mi catálogo</a>
            <a href="ver-mas-tarde.html">Ver más tarde</a>
            <a href="agregar.html" class="add-btn">+ Agregar</a>
            <a href="#" class="nav-user">Usuario</a>
            <a href="index.html">Salir</a>
        </div>
    </nav>

    <main class="form-container">

        <h1>Editar contenido</h1>
        <p>Modificá la información de la película o serie.</p>

        <form id="form-editar">

            <label for="titulo">Título</label>
            <input type="text" id="titulo" required>

            <label for="tipo">Tipo</label>
            <select id="tipo" required>
                <option value="Película">Película</option>
                <option value="Serie">Serie</option>
            </select>

            <label for="anio">Año</label>
            <input type="number" id="anio" required>

            <label for="genero">Género</label>
            <select id="genero" required>
                <option value="Acción">Acción</option>
                <option value="Aventura">Aventura</option>
                <option value="Comedia">Comedia</option>
                <option value="Drama">Drama</option>
                <option value="Terror">Terror</option>
                <option value="Ciencia ficción">Ciencia ficción</option>
                <option value="Romance">Romance</option>
                <option value="Animación">Animación</option>
            </select>

            <label for="duracion">Duración</label>
            <input type="text" id="duracion" required>

            <label for="calificacion">Calificación</label>
            <input type="number" id="calificacion" min="0" max="10" step="0.1" required>

            <label for="imagen">URL del poster</label>
            <input type="text" id="imagen" required>

            <label for="sinopsis">Sinopsis</label>
            <textarea id="sinopsis" rows="5" required></textarea>

            <button type="submit">Guardar cambios</button>

        </form>

    </main>

    <script type="module" src="js/editar.js"></script>

</body>
</html>
